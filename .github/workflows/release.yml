name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Создать черновик релиза'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "matrix=$(jq -c . .github/targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, targets]
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build static binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm }}
          GOMIPS: ${{ matrix.mips }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.webVersion=${GITHUB_REF_NAME}" -o "dist/doq-web-linux-${TARGET}" .
      - uses: actions/upload-artifact@v4
        with:
          name: doq-web-linux-${{ matrix.target }}
          path: dist/doq-web-linux-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: publish-raw-bins
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: doq-web-linux-*
          path: release
          merge-multiple: true
      - name: Verify release binaries
        run: |
          set -euo pipefail
          targets=$(jq -r '.include[].target' .github/targets.json)
          target_count=$(jq '.include | length' .github/targets.json)
          for target in $targets; do
            test -s "release/doq-web-linux-$target"
          done
          cd release
          sha256sum doq-web-linux-* > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq "$target_count"
          sha256sum -c SHA256SUMS
          chmod +x doq-web-linux-amd64
          test "$(./doq-web-linux-amd64 -version)" = "doq-web ${GITHUB_REF_NAME}"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/doq-web-linux-*
            release/SHA256SUMS
          draft: ${{ github.event.inputs.draft }}
          generate_release_notes: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          ref: raw-bins
          path: published
      - name: Publish binaries for the online installer
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current_main" != "$SOURCE_SHA" ]; then
            echo "Skipping raw-bins publish; main has advanced"
            exit 0
          fi
          cp release/doq-web-linux-* release/SHA256SUMS published/
          cd published
          printf '%s\n' "$SOURCE_SHA" > SOURCE_COMMIT
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add doq-web-linux-* SHA256SUMS SOURCE_COMMIT
          if git diff --cached --quiet; then
            echo 'Installer binaries are already up to date'
            exit 0
          fi
          git commit -m "Publish tested binaries from $SOURCE_SHA"
          git push origin HEAD:raw-bins
