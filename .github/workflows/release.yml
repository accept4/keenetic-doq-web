name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Создать черновик релиза'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify build
        run: go build -trimpath -ldflags="-s -w" -o /dev/null .

      - name: Test
        run: go test -v -count=1 ./...

      - name: Build Linux ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o doq-web-linux-arm64
          sha256sum doq-web-linux-arm64 >> SHA256SUMS

      - name: Build Linux ARM (v7)
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: 7
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o doq-web-linux-arm
          sha256sum doq-web-linux-arm >> SHA256SUMS

      - name: Build Linux MIPSLE (softfloat)
        env:
          GOOS: linux
          GOARCH: mipsle
          GOMIPS: softfloat
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o doq-web-linux-mipsle
          sha256sum doq-web-linux-mipsle >> SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            doq-web-linux-arm64
            doq-web-linux-arm
            doq-web-linux-mipsle
            SHA256SUMS
          draft: ${{ github.event.inputs.draft }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
